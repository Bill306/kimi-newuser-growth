<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新用户转化原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a phone (the product) floats on a dotted "lab bench"; the PM console sits beside it as a notebook. Stacks below 920px. */
:root{
  --paper:#F1EFEA; --dot:rgba(24,24,32,.08);
  --surface:#FFFFFF; --surface-2:#F5F6F8; --surface-3:#ECEEF2;
  --ink:#0D0F14; --fg:#15171D; --muted:#676D7C; --faint:#A0A5B1; --line:#E6E8ED;
  --accent:#2C5BFF; --accent-2:#13B5C9; --accent-soft:#EBF0FF; --accent-fg:#FFFFFF;
  --offer:#C2560C; --offer-soft:#FFF1E4;
  --ok:#14804A; --ok-soft:#E2F4E9; --warn:#C0352B; --warn-soft:#FCEBE9;
  --frame:#0B0C10; --scrim:rgba(10,12,18,.46);
  --shadow:0 40px 80px -30px rgba(18,22,40,.45),0 12px 24px -12px rgba(18,22,40,.25);
  --font:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC","Songti SC",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C0E13; --dot:rgba(255,255,255,.06);
  --surface:#161921; --surface-2:#1D212B; --surface-3:#252A36;
  --ink:#F2F4F8; --fg:#E9ECF2; --muted:#9AA2B3; --faint:#6C7385; --line:#2A303C;
  --accent:#7C9BFF; --accent-2:#3FD2E3; --accent-soft:#1F2A4D; --accent-fg:#0C0E13;
  --offer:#F2A35E; --offer-soft:#3A2715; --ok:#5DCB93; --ok-soft:#14301F; --warn:#FF8A80; --warn-soft:#3A1C1A;
  --frame:#000; --scrim:rgba(0,0,0,.62); --shadow:0 40px 80px -30px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C0E13; --dot:rgba(255,255,255,.06);
  --surface:#161921; --surface-2:#1D212B; --surface-3:#252A36;
  --ink:#F2F4F8; --fg:#E9ECF2; --muted:#9AA2B3; --faint:#6C7385; --line:#2A303C;
  --accent:#7C9BFF; --accent-2:#3FD2E3; --accent-soft:#1F2A4D; --accent-fg:#0C0E13;
  --offer:#F2A35E; --offer-soft:#3A2715; --ok:#5DCB93; --ok-soft:#14301F; --warn:#FF8A80; --warn-soft:#3A1C1A;
  --frame:#000; --scrim:rgba(0,0,0,.62); --shadow:0 40px 80px -30px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px;color:var(--fg);font:14px/1.6 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topline{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end;justify-content:space-between}
.topline .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.topline h1{font-family:var(--serif);font-weight:900;font-size:clamp(22px,3.2vw,30px);line-height:1.25;margin:2px 0 0;text-wrap:balance}
.topline h1 em{font-style:normal;color:var(--accent)}
.topline a{color:var(--fg);text-decoration:none;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:1px}
.disclaimer{font-size:12px;color:var(--muted);border-left:2px solid var(--offer);padding:2px 10px}
.stage{display:grid;grid-template-columns:420px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:920px){.stage{grid-template-columns:minmax(0,1fr)}}

/* ================= phone ================= */
.phone-col{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:16px}
@media (max-width:920px){.phone-col{position:static}.phone{height:740px}}
.phone-col::before{content:"";position:absolute;inset:40px 30px auto;height:520px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 22%,transparent),transparent);filter:blur(30px);z-index:0;pointer-events:none}
.phone{position:relative;z-index:1;width:min(390px,100%);height:clamp(640px,calc(100vh - 150px),780px);background:var(--surface);border:11px solid var(--frame);border-radius:48px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.status{display:flex;justify-content:space-between;align-items:center;padding:10px 24px 2px;font:600 13px var(--font);font-variant-numeric:tabular-nums}
.status .isl{width:96px;height:26px;border-radius:14px;background:var(--frame);position:absolute;left:50%;top:8px;transform:translateX(-50%)}
.status svg{width:46px;height:12px}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.04em;font-size:16px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:900 14px var(--font)}
.brand small{font-weight:500;color:var(--faint);letter-spacing:0;font-size:11px}
.meter{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;background:var(--surface)}
.meter .bar{width:48px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ink);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.meter.gift{border-color:var(--ok);color:var(--ok)}
.chat{flex:1;overflow-y:auto;padding:6px 16px 10px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.u{align-self:flex-end;max-width:84%;background:var(--surface-3);padding:9px 13px;border-radius:18px 18px 6px 18px;animation:rise .3s ease-out}
.ai{align-self:flex-start;max-width:94%;animation:rise .3s ease-out}
.ai p{margin:0 0 6px}
.ai ul{margin:0;padding-left:18px}
.ai .who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.ai .who .logo{width:18px;height:18px;border-radius:6px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:900 10px var(--font)}
.sys{align-self:stretch;text-align:center;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:10px}
.sys::before,.sys::after{content:"";flex:1;height:1px;background:var(--line)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{border:1px solid var(--line);border-radius:16px;padding:13px 14px;background:var(--surface);display:flex;flex-direction:column;gap:9px;animation:rise .35s ease-out}
.card h4{margin:0;font-size:14.5px;line-height:1.45}
.card .sub{font-size:12px;color:var(--muted)}
.card.tint{background:var(--surface-2);border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:500;transition:transform .15s,background .15s;display:inline-flex;gap:6px;align-items:center}
.btn svg.i{width:15px;height:15px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--offer);display:inline-flex;gap:6px;align-items:center}
.tag.blue{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}

/* onboarding */
.phone.ob .ph-input,.phone.ob .sugs{display:none}
.ob-screen{flex:1;display:flex;flex-direction:column;gap:14px;padding:4px 2px 4px;animation:rise .35s ease-out}
.ob-head{display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:5px}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--surface-3)}
.dots i.on{background:var(--ink)}
.ob-skip{border:none;background:none;color:var(--muted);font-size:12.5px;padding:4px}
.ob-title{font-family:var(--serif);font-weight:900;font-size:25px;line-height:1.3;margin:4px 0 0;letter-spacing:.01em}
.ob-title .grad{background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ob-sub{margin:0;color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--surface);font-size:13.5px;font-weight:500;animation:rise .4s ease-out both;animation-delay:calc(var(--i)*45ms);transition:border-color .15s,background .15s,transform .15s}
.tile:hover:not(:disabled){transform:translateY(-1px);border-color:var(--faint)}
.tile .ic{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--fg);flex:none;transition:background .15s,color .15s}
.tile small{display:block;font-weight:400;font-size:11px;color:var(--muted);line-height:1.35}
.tile[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.tile[aria-pressed="true"] .ic{background:var(--ink);color:var(--surface)}
.tile:disabled{opacity:.38;cursor:default}
.tiles.goals{grid-template-columns:1fr}
.tiles.goals .tile{padding:9px 12px}
.ob-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.cta-big{border:none;border-radius:16px;padding:14px;background:var(--ink);color:var(--surface);font-weight:700;font-size:15px;display:flex;justify-content:center;gap:8px;align-items:center;transition:opacity .2s}
.cta-big:disabled{opacity:.25;cursor:default}
.ob-note{text-align:center;font-size:11px;color:var(--faint)}
.preparing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:13px}
.orb{width:64px;height:64px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),var(--accent-2),var(--accent));animation:spin 1.1s linear infinite;-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%)}
@keyframes spin{to{transform:rotate(360deg)}}

/* prefilled task */
.taskcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);animation:rise .35s ease-out;flex:none}
.taskcard .hd{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.taskcard .cap{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.taskcard .hd b{display:block;font-size:14px;line-height:1.35}
.taskcard .hd span{font-size:11.5px;color:var(--muted)}
.taskcard .bd{padding:10px 14px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.taskcard ul{margin:0;padding-left:16px;font-size:12px;color:var(--muted);flex:1}
.sugs{display:flex;gap:8px;padding:8px 14px 2px;overflow-x:auto;flex:none;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sug{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--surface);font-size:12px;max-width:230px;text-align:left}
.sug span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug svg.i{width:14px;height:14px;color:var(--muted)}
.sug[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.sugs .lbl{flex:none;align-self:center;font-size:11px;color:var(--faint)}
.ph-input{padding:8px 12px 18px;display:flex;gap:8px;align-items:flex-end}
.boxwrap{flex:1;position:relative;border-radius:20px;padding:1.5px;background:var(--line)}
.boxwrap.prefilled{background:linear-gradient(120deg,var(--accent),var(--accent-2),var(--accent));background-size:200% 200%;animation:flow 3s ease infinite}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.box{min-height:44px;max-height:132px;overflow-y:auto;border-radius:18.5px;padding:11px 14px;font-size:13.5px;background:var(--surface-2);color:var(--fg);line-height:1.55}
.boxwrap.prefilled .box{background:var(--surface)}
.box.empty{color:var(--faint)}
.box .hint{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:10.5px;color:var(--faint)}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface);color:var(--muted)}
.send{width:44px;height:44px;border-radius:50%;border:none;background:var(--ink);color:var(--surface);display:grid;place-items:center;flex:none;transition:transform .15s}
.send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send:disabled{background:var(--surface-3);color:var(--faint);cursor:default}
.send.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 35%,transparent)}50%{box-shadow:0 0 0 9px transparent}}

/* agent progress */
.work{border:1px solid var(--line);border-radius:18px;padding:13px 14px;background:var(--surface);display:flex;flex-direction:column;gap:10px;animation:rise .35s ease-out;flex:none}
.work .top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.work .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--surface-3);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
.work.done .spin{border-color:var(--ok);background:var(--ok);animation:none}
.work .el{margin-left:auto;font:400 10.5px var(--mono);color:var(--faint)}
.pbar{height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s ease}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--faint)}
.steps li{display:flex;gap:8px;align-items:flex-start}
.steps li::before{content:"";width:9px;height:9px;margin-top:5px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.steps li.on{color:var(--fg)}
.steps li.on::before{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.steps li.done{color:var(--muted)}
.steps li.done::before{background:var(--ok);border-color:var(--ok);box-shadow:none}
.steps small{display:block;font-size:11px;color:var(--faint)}
.srcs{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.srcs i{width:14px;height:14px;border-radius:4px;animation:rise .25s ease-out both}

/* deliverable card */
.out{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);animation:rise .4s ease-out;flex:none}
.out .thumbwrap{background:linear-gradient(160deg,var(--surface-2),var(--surface-3));padding:14px 14px 0;display:flex;justify-content:center;border-bottom:1px solid var(--line);height:160px;overflow:hidden}
.out .meta{padding:11px 14px 13px;display:flex;flex-direction:column;gap:8px}
.out .meta b{font-size:14px;line-height:1.4}
.out .meta span{font-size:11.5px;color:var(--muted)}

/* rendered deliverables (thumbnail = scaled full render) */
.mini{transform-origin:top center;pointer-events:none;flex:none}
.slide{aspect-ratio:16/9;border-radius:5px;background:#fff;color:#16181D;border:1px solid #E5E7EC;padding:5px 6px;overflow:hidden;font-size:7.5px;line-height:1.3;position:relative}
.slide b{display:block;font-size:8px;margin-bottom:3px}
.slide.cover{background:linear-gradient(140deg,#0F1730,#1F3A8A);color:#fff;border-color:#0F1730}
.slide.cover b{font-size:9px}
.slide .bar{height:3px;border-radius:2px;background:#2C5BFF;margin-top:3px}
.slide .ln{height:2px;border-radius:1px;background:#D7DAE2;margin-top:3px}
.slide .ch{position:absolute;right:6px;bottom:6px;display:flex;gap:2px;align-items:flex-end;height:40%}
.slide .ch i{width:5px;background:#13B5C9;border-radius:1px}
.rep{display:flex;flex-direction:column;gap:12px;color:#16181D;background:#fff;border-radius:12px;padding:16px;box-shadow:0 8px 24px -14px rgba(0,0,0,.35)}
.rep .k{font:600 10px var(--mono);letter-spacing:.12em;color:#2C5BFF;text-transform:uppercase}
.rep h2{font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.35;margin:2px 0 0}
.rep .by{font-size:11px;color:#6A7080}
.rep .call{background:#F2F5FF;border-left:3px solid #2C5BFF;padding:9px 11px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.6}
.rep h5{margin:0;font-size:12.5px}
.rep p{margin:0;font-size:12.5px;line-height:1.7}
.rep ol{margin:0;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:5px;line-height:1.55}
.rep sup{color:#2C5BFF;font-size:9px;margin-left:1px}
.rep .src{font-size:11px;color:#6A7080;display:flex;flex-direction:column;gap:2px;border-top:1px solid #ECEEF2;padding-top:8px}
.badge{display:inline-block;font-size:9.5px;font-weight:700;color:#C2560C;background:#FFF1E4;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;letter-spacing:0}
.hbars{display:flex;flex-direction:column;gap:6px;font-size:11.5px}
.hbars .r{display:grid;grid-template-columns:70px 1fr 44px;gap:8px;align-items:center}
.hbars .t{height:12px;border-radius:3px;background:#ECEEF2;overflow:hidden}
.hbars .t i{display:block;height:100%;background:linear-gradient(90deg,#2C5BFF,#13B5C9);border-radius:3px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.hbars .v{font-family:var(--mono);font-size:11px;text-align:right;color:#4A5060}
.bigslide{aspect-ratio:16/9;border-radius:10px;background:linear-gradient(140deg,#0F1730,#1F3A8A);color:#fff;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;position:relative;overflow:hidden}
.bigslide::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#13B5C9,transparent 70%);opacity:.7}
.bigslide b{font-family:var(--serif);font-size:20px;line-height:1.3;position:relative;z-index:1}
.bigslide span{font-size:11px;opacity:.7;position:relative;z-index:1}
.grid-slides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-slides .slide{font-size:9px;padding:8px 9px}
.grid-slides .slide b{font-size:10px}
.xl{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.xl th{background:#F1F3F7;color:#4A5060;font-weight:600;text-align:left;padding:6px 7px;border:1px solid #E3E6EC}
.xl td{padding:6px 7px;border:1px solid #E3E6EC}
.xl td:not(:first-child){font-family:var(--mono);font-size:11px}
.browser{border-radius:12px;overflow:hidden;border:1px solid #E3E6EC;background:#fff;color:#16181D;box-shadow:0 8px 24px -14px rgba(0,0,0,.35)}
.browser .chrome{display:flex;gap:6px;align-items:center;padding:7px 10px;background:#F1F3F7;font:11px var(--mono);color:#6A7080}
.browser .chrome i{width:8px;height:8px;border-radius:50%;background:#D5D8DF}
.browser .chrome span{margin-left:6px;background:#fff;border-radius:6px;padding:2px 8px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.browser .hero{padding:24px 16px 20px;background:linear-gradient(140deg,#0F1730,#1F3A8A);color:#fff;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.browser .hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#13B5C9,transparent 70%);opacity:.6}

function bars(o){ const max=Math.max(...o.b.map(x=>x[1]))||1; return '<div class="hbars">'+o.b.map(([l,v])=>'<div class="r"><span>'+esc(l)+'</span><span class="t"><i style="width:'+Math.max(4,v/max*100).toFixed(0)+'%"></i></span><span class="v">'+v+(o.u||'')+'</span></div>').join('')+'</div>'; }
function slideHtml(t,i){
  if(i===0) return '<div class="slide cover"><b>'+esc(t)+'</b><span style="opacity:.6">汇报 · 2026</span></div>';
  const h=[40,65,52,80,70];
  return '<div class="slide"><b>'+String(i).padStart(2,'0')+'  '+esc(t)+'</b><div class="bar" style="width:'+(28+(i*17)%40)+'%"></div><div class="ln" style="width:55%"></div><div class="ln" style="width:42%"></div><div class="ln" style="width:48%"></div>'+(i%2?'<span class="ch">'+h.map((x,j)=>'<i style="height:'+((x+i*9+j*7)%70+30)+'%"></i>').join('')+'</span>':'')+'</div>';
}

function syncConsole(){
  const seg=SEG[S.scene];
  [['#vB','B'],['#vA','A']].forEach(([id,v])=>{ const b=$(id); b.innerHTML=''; b.append(seg[v][0]); const s=document.createElement('small'); s.textContent=seg[v][1]; b.append(s); b.setAttribute('aria-pressed', S.variant===v); });
  S.fmap={};
  $('#funnel').innerHTML=FUNNELS[S.scene].map(([id,label,ev,evs,cls])=>{ evs.forEach(e=>S.fmap[e]='#'+id); return '<div class="fstep'+(cls?' '+cls:'')+'" id="'+id+'"><b>'+label+'</b>'+ev+'</div>'; }).join('');
}
function note(title, body, why){ $('#note').innerHTML='<h2>当前节点 · 设计说明</h2><h3>'+title+'</h3>'+body+(why?'<p class="why">'+why+'</p>':''); }
function log(name, props){
  const ul=$('#log'); const empty=ul.querySelector('.empty-log'); if(empty) empty.remove();
  const li=document.createElement('li');
  const sec=((Date.now()-S.t0)/1000).toFixed(1);
  const p=Object.entries(Object.assign({variant:S.variant}, props||{})).map(([k,v])=>k+'='+v).join('  ');
  li.innerHTML='<span class="ts">+'+sec+'s</span><span class="ev"></span><span class="pr"></span>';
  li.querySelector('.ev').textContent=name; li.querySelector('.pr').textContent=p;
  ul.prepend(li);
  if(S.fmap[name]) $(S.fmap[name]).classList.add('hit');
}
function resetConsole(){ S.t0=Date.now(); $('#log').innerHTML='<li class="empty-log">还没有事件。在手机里操作开始。</li>'; syncConsole(); }

/* ---------- phone helpers ---------- */
function setQuota(v,label,mode){
  S.quota=v; $('#meterBar').style.width=v+'%'; $('#meterLabel').textContent=label||('额度 '+v+'%');
  $('#meter').classList.toggle('gift', mode==='gift');
  $('#meter').hidden=(S.variant==='A');   /* 现状：额度只在 设置→订阅 里能看到 */
}
function add(html, cls){ const d=document.createElement('div'); d.className=cls; d.innerHTML=html; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
const user=t=>add('', 'u').appendChild(document.createTextNode(t));
const ai=h=>add('<div class="who"><span class="logo">K</span>Kimi</div>'+h,'ai');
const sys=t=>add(esc(t),'sys');
const card=(html, extra)=>add(html,'card'+(extra?' '+extra:''));
async function typing(ms){ const d=add('<div class="who"><span class="logo">K</span>Kimi</div><span style="color:var(--faint)">正在思考…</span>','ai'); await sleep(ms||900); d.remove(); }
function setInput(text, onSend, opts){
  const box=$('#inputBox'), btn=$('#sendBtn'), bw=$('#boxwrap'); opts=opts||{};
  bw.classList.remove('prefilled');
  if(!text){ box.textContent=opts.placeholder||'给 Kimi 发消息…'; box.classList.add('empty'); btn.disabled=true; btn.classList.remove('pulse'); btn.onclick=null; return; }
  box.classList.remove('empty'); box.textContent=text;
  if(opts.prefilled){ bw.classList.add('prefilled'); const h=document.createElement('div'); h.className='hint'; h.innerHTML='<span>已为你填好，可以直接改</span><span><span class="kbd">Enter</span> 发送</span>'; box.appendChild(h); }
  btn.disabled=false; btn.classList.add('pulse');
  const run=S.run;
  btn.onclick=()=>{ if(run!==S.run) return; setInput(''); onSend(); };
}
function toast(t, bad){ toastEl.textContent=t; toastEl.className='toast'+(bad?' bad':''); toastEl.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.hidden=true, 2200); }
function sugs(html){ const el=$('#sugs'); if(!html){ el.hidden=true; el.innerHTML=''; return el; } el.innerHTML=html; el.hidden=false; return el; }
function openSheet(html, cls){ sheet.className='sheet'+(cls?' '+cls:''); sheet.innerHTML=html; sheet.hidden=false; mask.hidden=false; sheet.scrollTop=0; }
function closeSheet(){ sheet.hidden=true; mask.hidden=true; }
const alive=run=>run===S.run;
function reset(){ closeSheet(); sugs(''); setInput(''); phone.classList.remove('ob'); chat.innerHTML=''; resetConsole(); }

async function progress(steps, run, opts){
  opts=opts||{};
  const c=add('<div class="top"><span class="spin"></span><span class="ttl">'+(opts.title||'Kimi 正在工作')+'</span><span class="el">'+(opts.eta||'')+'</span></div><div class="pbar"><i></i></div><ul class="steps">'+steps.map(s=>'<li><div>'+esc(s[0])+(s[1]?'<small>'+esc(s[1])+'</small>':'')+'</div></li>').join('')+'</ul>','work');
  const lis=c.querySelectorAll('li'), bar=c.querySelector('.pbar i');
  for(let i=0;i<steps.length;i++){
    if(!alive(run)) return null;
    lis[i].classList.add('on'); bar.style.width=((i+1)/steps.length*100)+'%';
    if(opts.sources && i===1){
      const sm=lis[i].querySelector('small'); const box=document.createElement('div'); box.className='srcs'; lis[i].firstChild.appendChild(box);
      for(let n=1;n<=42;n++){ if(!alive(run)) return null; if(n%3===0){ const d=document.createElement('i'); d.style.background='hsl('+(n*37%360)+' 55% 72%)'; box.appendChild(d);} sm.textContent='正在阅读来源 '+n+' / 42'; if(n%6===0) chat.scrollTop=chat.scrollHeight; await sleep(20); }
    }
    if(opts.onTick) opts.onTick(i);
    chat.scrollTop=chat.scrollHeight;
    await sleep(opts.step||650);
    lis[i].classList.remove('on'); lis[i].classList.add('done');
  }
  c.classList.add('done'); c.querySelector('.ttl').textContent=opts.doneTitle||'已完成';
  return c;
}

/* ================= Scene 1: Day 1, signup → first Aha (P0) ================= */
const FIRST_Q='宁德时代和比亚迪的储能业务，谁更有竞争力？';
function homeWelcome(sub){
  chat.innerHTML='<div class="ob-screen" style="justify-content:center;align-items:center;text-align:center;gap:12px"><div class="brand" style="font-size:30px"><span class="logo" style="width:40px;height:40px;font-size:20px;border-radius:12px">K</span>Kimi</div><p class="ob-sub">'+esc(sub)+'</p><div class="row" style="justify-content:center;gap:6px">'+['research','ppt','doc','web','sheet'].map(g=>'<span class="sug" style="pointer-events:none">'+icon(g)+'<span>'+CAP[g].cap+'</span></span>').join('')+'</div></div>';
}
function scene1(){
  const run=++S.run; S.scene=1; reset(); setQuota(100);
  log('signup_complete',{channel:'wechat'});
  if(S.variant==='A') return controlDay1(run);
  onboarding(run);
}

/* --- Treatment: two tap-only questions, full-screen --- */
function onboarding(run){
  const ob={role:null, goals:[]};
  phone.classList.add('ob');
  log('onboarding_show',{questions:2});
  note('P0 · 注册后先问 2 个问题','<p>注册成功后不直接进空白首页，而是用两个点选问题了解用户：<b>做什么工作、最近想搞定什么</b>。</p><ul><li>全部点选，不用打字，约 10 秒</li><li>右上角随时可以跳过；跳过的人在首问之后由「能力推荐卡」兜底</li></ul>','为什么：走查发现最大的流失点在「首问 → 激活」。新用户不知道 Kimi 能做什么，也想不出该让它做什么。');
  const step1=()=>{
    chat.innerHTML='<div class="ob-screen"><div class="ob-head"><div class="dots"><i class="on"></i><i></i></div><button class="ob-skip" id="skip">跳过</button></div><div><h2 class="ob-title">注册成功，<br><span class="grad">先认识一下你</span></h2><p class="ob-sub">你主要用 Kimi 做哪方面的事？</p></div><div class="tiles" id="roles">'+ROLES.map((r,i)=>'<button class="tile" style="--i:'+i+'" data-role="'+r[0]+'" aria-pressed="false"><span class="ic">'+icon(r[0])+'</span><span>'+r[1]+'<small>'+r[2]+'</small></span></button>').join('')+'</div><div class="ob-foot"><div class="ob-note">只用来推荐任务，之后可以在设置里改</div></div></div>';
    chat.querySelector('#skip').onclick=()=>{ if(!alive(run)) return; log('onboarding_skip',{at:'q1'}); skipPath(run); };
    chat.querySelectorAll('[data-role]').forEach(b=>b.onclick=async()=>{
      if(!alive(run)) return;
      chat.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed', x===b));
      ob.role=b.dataset.role; log('onboarding_answer',{q:'role',value:ob.role});
      await sleep(320); if(alive(run)) step2();
    });
  };
  const step2=()=>{
    const rl=ROLES.find(r=>r[0]===ob.role)[1];
    chat.innerHTML='<div class="ob-screen"><div class="ob-head"><div class="dots"><i class="on"></i><i class="on"></i></div><button class="ob-skip" id="skip">跳过</button></div><div><h2 class="ob-title">最近想<span class="grad">搞定什么</span>？</h2><p class="ob-sub">'+esc(rl)+' · 最多选 3 个，Kimi 会把第一个任务准备好</p></div><div class="tiles goals" id="goals">'+GOALS.map((g,i)=>'<button class="tile" style="--i:'+i+'" data-goal="'+g[0]+'" aria-pressed="false"><span class="ic">'+icon(g[0])+'</span><span>'+g[1]+'<small>'+g[2]+'</small></span></button>').join('')+'</div><div class="ob-foot"><button class="cta-big" id="gen" disabled>帮我准备第一个任务 '+icon('arrow')+'</button><button class="ob-skip" id="back">← 上一步</button></div></div>';
    const gen=chat.querySelector('#gen');
    const refresh=()=>{ gen.disabled=!ob.goals.length; chat.querySelectorAll('[data-goal]').forEach(b=>{ b.disabled = ob.goals.length>=3 && b.getAttribute('aria-pressed')!=='true'; }); };
    chat.querySelector('#skip').onclick=()=>{ if(!alive(run)) return; log('onboarding_skip',{at:'q2'}); skipPath(run); };
    chat.querySelector('#back').onclick=()=>{ if(alive(run)){ ob.goals=[]; step1(); } };
    chat.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{
      if(!alive(run)) return;
      const id=b.dataset.goal, on=b.getAttribute('aria-pressed')==='true';
      if(on){ ob.goals=ob.goals.filter(g=>g!==id); b.setAttribute('aria-pressed','false'); }
      else if(ob.goals.length<3){ ob.goals.push(id); b.setAttribute('aria-pressed','true'); }
      log('onboarding_answer',{q:'goal',value:id,on:!on}); refresh();
    });
    gen.onclick=async()=>{
      if(!alive(run)) return;
      log('onboarding_complete',{role:ob.role,goals:ob.goals.join('+')});
      chat.innerHTML='<div class="preparing"><div class="orb"></div><div>正在为你准备第一个任务…</div></div>';
      await sleep(1100); if(!alive(run)) return;
      phone.classList.remove('ob'); chat.innerHTML='';
      sys('注册成功 · 第 1 天');
      prefill(run, ob);
    };
  };
  step1();
}

/* --- Treatment: a personalised task waits in the input box --- */
function prefill(run, ob){
  const opts=ob.goals.slice();
  ['research','ppt','doc'].forEach(g=>{ if(opts.length<3 && !opts.includes(g)) opts.push(g); });
  ai('<p>欢迎！根据你的情况，我把第一个任务<b>填进输入框了</b>。直接按发送就开始，也可以改几个字再发。</p>');
  const tc=add('','taskcard');
  const pick=(g, rank, by)=>{
    const t=P[ob.role][g], m=CAP[g];
    S.cur={role:ob.role, goal:g, title:t[0], prompt:t[1], rank:rank};
    tc.innerHTML='<div class="hd"><span class="cap">'+icon(g)+'</span><div><b>'+esc(t[0])+'</b><span>'+m.cap+' · '+m.time+' · 发送后你会得到</span></div></div><div class="bd"><ul>'+m.has.map(h=>'<li>'+h+'</li>').join('')+'</ul><span class="pill">新人首个任务免费</span></div>';
    sugs('<span class="lbl">换一个</span>'+opts.map((o,i)=>'<button class="sug" data-g="'+o+'" data-r="'+(i+1)+'" aria-pressed="'+(o===g)+'">'+icon(o)+'<span>'+esc(P[ob.role][o][0])+'</span></button>').join(''))
      .querySelectorAll('.sug').forEach(b=>b.onclick=()=>{ if(!alive(run)) return; pick(b.dataset.g, +b.dataset.r, 'swap'); });
    setInput(t[1], ()=>firstTask(run), {prefilled:true});
    log('prefill_show',{goal:g,rank:rank,by:by});
    chat.scrollTop=chat.scrollHeight;
  };
  pick(opts[0],1,'auto');
  note('P0 · 专属任务已经填好，按发送就开始','<p>根据两个回答，把一个<b>和用户自己有关的完整任务</b>直接填进输入框，用户只需要按发送（或 Enter）。</p><ul><li>输入框上方能换成另外两个推荐，也能自己改</li><li>任务卡提前说清楚：要多久、会得到什么</li><li>首个 Agent 任务免费、不占额度，保证第一次体验不撞墙</li></ul>','对比现状：灵感库里的案例是别人的，用户还得自己改写成自己的需求；预填任务的第一句话就是用户自己的事。');
}

async function firstTask(run){
  sugs(''); const cur=S.cur, m=CAP[cur.goal], o=O[cur.role||'finance'][cur.goal];
  user(cur.prompt);
  log('prefill_send',{goal:cur.goal,rank:cur.rank,edited:false});
  log('agent_task_start',{type:m.cap,first:true,cost:'free_gift'});
  setQuota(100,'新人赠送 · 不占额度','gift');
  note('P0 · Kimi 正在工作','<p>过程透明：每一步在做什么、读了多少来源，都实时显示。</p>','第一次体验要让用户看到「它真的在替我干活」，这本身就是 Aha 的一部分。');
  const p=await progress(m.steps,run,{eta:m.time+' · 演示已加速',sources:(cur.goal==='research'||cur.goal==='learn'),doneTitle:'已完成 · '+m.cap}); if(!p) return;
  setQuota(100);
  const out=add('<div class="thumbwrap">'+renderThumb(cur.goal,o,cur.title)+'</div><div class="meta"><b>'+esc(cur.title)+'</b><span>'+m.meta+' · 刚刚生成 · 已保存到「最近任务」</span><div class="row"><button class="btn primary" id="openOut">打开查看</button><button class="btn" id="dlOut">下载</button></div></div>','out');
  log('agent_task_done',{type:m.cap,first:true,quota_used:'0%'});
  note('P0 · 成果已经做好','<p>从注册到拿到一份能直接用的成果，用户只做了几次点选和 1 次发送。</p>','Aha 的定义：完成一次 Agent 任务，并<b>打开或下载</b>了产出。只生成、不查看不算。');
  const open=out.querySelector('#openOut'), dl=out.querySelector('#dlOut');
  const aha=how=>{
    if(!alive(run)) return;
    open.disabled=dl.disabled=true;
    log('aha_reached',{via:how,goal:cur.goal,seconds_from_signup:((Date.now()-S.t0)/1000).toFixed(0)});
    if(how==='download'){ toast('已下载（演示）'); afterAha(run); return; }
    openSheet('<button class="x" aria-label="关闭">×</button>'+renderFull(cur.goal,o,cur.title)+'<button class="cta-big" id="shClose">完成</button>','doc');
    const done=()=>{ closeSheet(); afterAha(run); };
    sheet.querySelector('.x').onclick=done; sheet.querySelector('#shClose').onclick=done;
  };
  open.onclick=()=>aha('open'); dl.onclick=()=>aha('download');
}

function afterAha(run){
  if(!alive(run)) return;
  const cur=S.cur;
  const next=(cur.goal==='research'||cur.goal==='learn')?[['ppt','把它做成 PPT'],['doc','每周一给我更新一次']]:[['doc','再改一版'],['research','用同样的方式再做一个']];
  ai('<p>做好了，已经保存在「最近任务」里。接下来可以：</p><div class="row" style="margin-top:6px">'+next.map(n=>'<button class="btn" data-n="'+n[1]+'">'+icon(n[0])+n[1]+'</button>').join('')+'</div>')
    .querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ if(!alive(run)) return; log('next_action_click',{action:b.dataset.n}); toast('已记下，下次打开时接着做'); });
  note('P0 · 第一次 Aha','<p>用户第一次看到 Kimi 和普通聊天机器人的区别：<b>一句话 → 一份能直接用的成果</b>。</p><ul><li>结尾给出下一步，成果保存在首页，留下回来的理由</li></ul>','对应指标：Aha 达成率、D1 留存（先行指标）→ Agent 渗透率 → 额度触顶率 → 7 日会员转化率。Aha 的人越多，后面撞墙、进入付费漏斗的人越多。');
  recap(run);
}
function recap(run){
  setTimeout(()=>{ if(!alive(run)) return;
    const secs=((Date.now()-S.t0)/1000).toFixed(0);
    card('<span class="tag green" style="color:var(--ok)">本次体验</span><h4>从注册到拿到第一份成果：'+secs+' 秒（演示已加速）</h4><div class="sub">全程只需要点选 + 按 1 次发送，不用自己想要问什么。</div><button class="btn" id="again" style="align-self:flex-start">换一个身份再试一次 ↺</button>','tint')
      .querySelector('#again').onclick=()=>scene1();
  }, 600);
}

/* --- Treatment fallback: user skipped onboarding → capability card after first question --- */
function skipPath(run){
  phone.classList.remove('ob');
  homeWelcome('跳过了引导，直接从提问开始');
  note('P0 兜底 · 跳过引导的用户','<p>不想回答问题的用户直接进首页。首问回答之后，按问题意图推荐<b>一个</b>能一键执行的 Agent 能力。</p>','这就是原来的「能力发现卡」，现在作为 P0 的兜底路径，保证跳过的人也有机会到达 Aha。');
  setInput(FIRST_Q, async()=>{
    chat.innerHTML=''; user(FIRST_Q); log('query_send',{n:1});
    await typing(); if(!alive(run)) return;
    plainAnswer();
    await sleep(500); if(!alive(run)) return;
    const c=add('<div class="hd"><span class="cap">'+icon('research')+'</span><div><b>把这个问题做成一份深度研究报告？</b><span>约 3 分钟 · 检索 40+ 来源并标注引用</span></div></div><div class="bd"><ul><li>开头一句话结论</li><li>关键数据对比图</li></ul><span class="pill">新人首个任务免费</span></div><div class="bd" style="padding-top:0"><button class="btn primary" id="capGo">生成深度研究</button><button class="btn ghost" id="capNo">先不用</button></div>','taskcard');
    log('capability_card_show',{intent:'company_compare',suggest:'deep_research'});
    const go=c.querySelector('#capGo'), no=c.querySelector('#capNo');
    no.onclick=()=>{ if(!alive(run)) return; log('capability_card_dismiss'); log('session_end',{agent_used:false}); c.remove(); ai('<p>好的，有需要随时说。</p>'); };
    go.onclick=()=>{ if(!alive(run)) return; go.disabled=no.disabled=true; log('capability_card_click');
      S.cur={role:'finance',goal:'research',title:P.finance.research[0],prompt:'生成深度研究',rank:0};
      firstTask(run); };
  });
}
function plainAnswer(){
  ai('<p>简单说：<b>宁德时代</b>在储能电芯出货和海外大客户上领先，<b>比亚迪</b>在系统集成和成本控制上更强。两者路线不同，各有优势。</p><p style="color:var(--faint);font-size:11.5px">（演示用的简短回答，不构成投资建议）</p>');
}

/* --- Control: current behaviour --- */
function controlDay1(run){
  homeWelcome('有什么可以帮你？');
  note('P0 对照组 · 现状','<p>注册后直接进入首页：一个输入框加一排能力按钮。用户得自己想出要问什么，通常先问一个普通问题。</p>','能力按钮和用户自己的事没有关系；精彩案例要点进具体能力才看得到。');
  setInput(FIRST_Q, async()=>{
    chat.innerHTML=''; user(FIRST_Q); log('query_send',{n:1});
    await typing(); if(!alive(run)) return;
    plainAnswer();
    await sleep(600); if(!alive(run)) return;
    sys('用户得到一个普通回答，然后离开');
    log('session_end',{agent_used:false,queries:1});
    note('P0 对照组 · 问完就走','<p>回答和普通聊天机器人差不多。用户没接触任何 Agent 能力，后面也就不会撞墙、不会进入付费漏斗。</p>','这是走查观察到的现象，流失比例需要用埋点数据确认。切回实验组对比。');
  });
}

/* ---------- wiring ---------- */
function setVariant(v){ S.variant=v; scene1(); }
$('#vB').onclick=()=>setVariant('B');
$('#vA').onclick=()=>setVariant('A');
$('#restart').onclick=()=>scene1();
mask.onclick=()=>{ const x=sheet.querySelector('.x'); if(x) x.click(); };
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter' || e.isComposing) return;
  const t=e.target; if(t && t.closest && t.closest('button,input,textarea,select,a')) return;
  const b=$('#sendBtn'); if(!b.disabled && sheet.hidden){ e.preventDefault(); b.click(); }
});
scene1();
})();
</script>
